name: Controleer Firebase Spark toegangsregels
on:
  push:
    branches: [main]
    paths:
      - 'database.rules.json'
      - 'tests/firebase-rules.test.mjs'
      - 'package.json'
      - 'web/spark-logic.js'
      - '.github/workflows/rules-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Installeer emulator en testbibliotheek
        run: npm install --no-audit --no-fund
      - name: Start lokale Firebase database-emulator en controleer toegangsregels
        run: npx firebase emulators:exec --project demo-squad-spark-rules --only database "node --test tests/firebase-rules.test.mjs"
