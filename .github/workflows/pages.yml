name: SQUAD 3D oefenstand publiceren

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: squad-github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Bouw en publiceer SQUAD
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installeer webafhankelijkheden
        run: npm install --no-audit --no-fund
        working-directory: web
      - name: Controleer spelregels
        run: node --test tests/*.test.mjs && node -e "JSON.parse(require('fs').readFileSync('database.rules.json','utf8'))"
      - name: Bouw 3D-webapp
        env:
          GITHUB_PAGES: 'true'
        run: npm run build
        working-directory: web
      - name: Configureer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - name: Wacht tot GitHub het publicatiebestand kan vinden
        run: sleep 15
      - name: Publiceer website
        id: deployment
        uses: actions/deploy-pages@v4
